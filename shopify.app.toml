# This file stores configurations for your Shopify app.

name = "Dorec Store Sync Live"
client_id = "c9045bbb10f21af7d4d6ffa74a720e1d"
application_url = "https://store-sync-pro-production-62d0.up.railway.app"
embedded = true

[auth]
redirect_urls = [
  "https://store-sync-pro-production-62d0.up.railway.app/auth/callback",
  "https://store-sync-pro-production-62d0.up.railway.app/auth/shopify/callback",
  "https://store-sync-pro-production-62d0.up.railway.app/api/auth/callback"
]

[access_scopes]
scopes = "write_products,read_products,write_inventory,read_inventory"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update", "products/delete"]
  uri = "/webhooks/products"

  [[webhooks.subscriptions]]
  topics = ["collections/create", "collections/update", "collections/delete"]
  uri = "/webhooks/collections"

  [[webhooks.subscriptions]]
  topics = ["inventory_levels/update"]
  uri = "/webhooks/inventory"

  [[webhooks.subscriptions]]
  topics = ["bulk_operations/finish"]
  uri = "/webhooks/bulk-finish"

  # Mandatory compliance webhooks
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
